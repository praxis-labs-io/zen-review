# Release workflow for zen-review
# Builds the binaries for a version tag and cuts the GitHub release from them.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.26"

# Nothing here writes. The release job asks for more itself.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    # Everything is pure Go, so one linux runner cross-compiles every target
    # and there is no macOS runner in the bill. The set matches the one CI
    # builds, windows/arm64 excluded there and so absent here.
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"

          binary="zen-review"
          if [ "$GOOS" = "windows" ]; then
            binary="zen-review.exe"
          fi

          mkdir -p build dist
          # -trimpath so the archive does not carry the runner's paths, and the
          # version stamped in here is the only thing that sets it: a plain
          # go build reports dev.
          go build -trimpath \
            -ldflags "-s -w -X github.com/praxis-labs-io/zen-review/internal/version.Version=${version}" \
            -o "build/${binary}" ./cmd/zen-review

          # zip for windows and tar for the rest, each being what that platform
          # opens without reaching for anything.
          archive="dist/zen-review_${version}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd build && zip -q "../${archive}.zip" "$binary")
          else
            tar -czf "${archive}.tar.gz" -C build "$binary"
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zen-review_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    # The one job that writes, and only to the release.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # --verify-tag so a workflow triggered by anything but a real tag on
        # this commit fails rather than inventing one.
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
