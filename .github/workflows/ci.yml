# Continuous Integration workflow for zen-review
# Runs on pushes to main and non-draft pull requests

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # ready_for_review is required so marking a draft PR ready triggers a run;
    # the default types (opened, synchronize, reopened) don't fire on that
    # transition. Draft PRs still emit these events — the job-level `if` below
    # is what actually skips them.
    types: [opened, synchronize, reopened, ready_for_review]
    # No branch filter. A PR onto a stacked branch would otherwise trigger
    # nothing, and required checks that never ran report as satisfied.

concurrency:
  # The action is part of the key so a `ready_for_review` run can't be cancelled
  # by a `synchronize` run that raced it. Pushing and marking ready in one go
  # sends both at once: synchronize still carries `draft: true`, so its jobs
  # skip, and if it also cancelled the ready run the PR ended up with no CI at
  # all while reporting only skipped checks.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26"

# Nothing here writes. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  lint:
    name: Lint + Format
    # Skip while the PR is a draft; push events (main) have no PR object and
    # always run. Marking the PR ready (ready_for_review) re-fires CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Both through the Makefile, so "what lint means" has one definition.
      - name: Check go mod tidy
        run: make mod-tidy

      - name: Check gofmt
        run: make fmt

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep this matching the local brew version, or local runs and CI
          # stop agreeing about what passes.
          version: v2.12.2

      - name: Run actionlint
        run: make lint-actions

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -v ./cmd/zen-review

  install-script:
    name: Install script (${{ matrix.shell }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Resolved with a token because runners share the anonymous API rate limit.
      - name: Resolve the release to install
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo ${{ github.repository }} --json tagName --jq .tagName
          if (-not $tag) { throw "could not resolve a published release to install" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # shell: takes no matrix context, so the shell under test runs as a child of the default one.
      - name: Install the latest release
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./install.ps1

      - name: Check it runs and reports a released version
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\zen-review\zen-review.exe'
          if (-not (Test-Path $exe)) { throw "the installer left no binary at $exe" }
          $reported = & $exe --version
          Write-Host $reported
          if ($reported -match 'zen-review version dev') { throw "installed binary reports dev: $reported" }
          if ($reported -notmatch 'zen-review version \d+\.\d+\.\d+') { throw "unexpected version line: $reported" }

      # Piped the way the docs say to run it, and over the first install, which is the upgrade Windows makes awkward.
      - name: Install again, the way the docs say to run it
        env:
          VERSION: ${{ steps.release.outputs.tag }}
        run: |
          $report = & ${{ matrix.shell }} -NoProfile -Command {
            $before = [Net.ServicePointManager]::SecurityProtocol
            Get-Content ./install.ps1 -Raw | Invoke-Expression
            $after = [Net.ServicePointManager]::SecurityProtocol
            [pscustomobject]@{
              ErrorAction = "$ErrorActionPreference"
              Progress = "$ProgressPreference"
              StrictMode = $(try { $null = $undefinedAfterInstall; 'off' } catch { 'on' })
              KeptProtocols = $(if ([int]$before -eq 0) { [int]$after -eq 0 } else { ($after -band $before) -eq $before })
              AllowsTls12 = [int]$after -eq 0 -or ($after -band [Net.SecurityProtocolType]::Tls12) -ne 0
            }
          }
          $report | Format-List | Out-String | Write-Host
          if ($report.ErrorAction -ne 'Continue') { throw "the install left ErrorActionPreference at $($report.ErrorAction)" }
          if ($report.Progress -ne 'Continue') { throw "the install left ProgressPreference at $($report.Progress)" }
          if ($report.StrictMode -ne 'off') { throw 'the install left StrictMode on in the session' }
          if (-not $report.KeptProtocols) { throw 'the install narrowed the security protocols the session allowed' }
          if (-not $report.AllowsTls12) { throw 'the install left TLS 1.2 disallowed' }

      # An exit under `irm | iex` closes the user's terminal, so the marker only prints if the failure left the session alive.
      - name: A failed install under iex leaves the session running
        env:
          VERSION: v0.0.0
        run: |
          $out = & ${{ matrix.shell }} -NoProfile -Command {
            try { Get-Content ./install.ps1 -Raw | Invoke-Expression } catch { Write-Host $_ }
            'session survived'
          }
          if ($out -notcontains 'session survived') { throw 'a failed install ended the session' }
          $bootstrap = Join-Path $env:RUNNER_TEMP 'bootstrap.ps1'
          Set-Content -Path $bootstrap -Value @'
          try { Get-Content ./install.ps1 -Raw | Invoke-Expression } catch { Write-Host $_ }
          'script survived'
          '@
          $out = & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File $bootstrap
          if ($out -notcontains 'script survived') { throw 'a failed install ended the script that piped it' }

      # A caller running the installer as a file reads its exit code, so a failure has to reach it.
      - name: A failed install run as a file exits 1
        env:
          VERSION: v0.0.0
        run: |
          & ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./install.ps1
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($code -ne 1) { throw "a failed install run as a file exited $code, not 1" }
